[workspace]
members = ["programs/*"]
resolver = "2"
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Agave 2.3.0 defaults to Rust 1.84; this program requires Rust 1.89.
[workspace.metadata.solana]
tools-version = "v1.52"
